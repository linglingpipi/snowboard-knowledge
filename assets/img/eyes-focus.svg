<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="PingFang SC, Microsoft YaHei, -apple-system, sans-serif">
  <!-- 视线：低头看板 vs 抬头看前进方向 -->
  <g>
    <text x="250" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#dc2626">✗ 低头看板</text>
    <text x="750" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#16a34a">✓ 视线转向前进方向</text>
    <line x1="500" y1="20" x2="500" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- 左：低头 —— 头下垂，视线落在脚 -->
    <g>
      <g stroke="#1f2937" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="120" y1="330" x2="360" y2="330" stroke="#334155" stroke-width="9"/>
        <path d="M 200 328 L 204 276 L 246 262"/>
        <path d="M 280 328 L 276 276 L 246 262"/>
        <path d="M 246 262 L 244 182"/>
        <circle cx="246" cy="140" r="30"/>
      </g>
      <line x1="252" y1="134" x2="250" y2="236" stroke="#dc2626" stroke-width="5" stroke-dasharray="5,5"/>
      <circle cx="250" cy="248" r="7" fill="#dc2626"/>
      <text x="240" y="392" text-anchor="middle" font-size="15" fill="#dc2626">盯着脚 → 预判慢、上身被迫后缩</text>
    </g>

    <!-- 右：抬头 -->
    <g>
      <g stroke="#15803d" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="610" y1="330" x2="850" y2="330" stroke="#334155" stroke-width="9"/>
        <path d="M 690 328 L 694 276 L 736 262"/>
        <path d="M 770 328 L 766 276 L 736 262"/>
        <path d="M 736 262 L 734 206"/>
        <circle cx="736" cy="164" r="30"/>
      </g>
      <path d="M 748 156 L 900 120" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 5" fill="none"/>
      <circle cx="902" cy="119" r="8" fill="none" stroke="#16a34a" stroke-width="5"/>
      <text x="740" y="392" text-anchor="middle" font-size="15" fill="#16a34a">抬眼看向要去的地方 → 身体自然带向目标</text>
    </g>
  </g>
</svg>